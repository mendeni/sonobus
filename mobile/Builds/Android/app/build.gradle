apply plugin: 'com.android.application'

def ndkVersionString = "28.1.13356709"

android {
    compileSdk 36
    ndkVersion ndkVersionString
    namespace "com.sonosaurus.sonobus"
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        juceSigning {
            storeFile     file("${System.properties['user.home']}${File.separator}.android${File.separator}sonouploadnew.jks")
            storePassword "${sonoupload_keystore_password}"
            keyAlias      "${sonoupload_key}"
            keyPassword   "${sonoupload_key_password}"
            storeType     "jks"
        }
    }

    defaultConfig {
        applicationId "com.sonosaurus.sonobus"
        minSdkVersion    24
        targetSdkVersion 36
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static", "-DANDROID_CPP_FEATURES=exceptions rtti", "-DANDROID_ARM_MODE=arm", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_WEAK_API_DEFS=ON", "-DCMAKE_CXX_STANDARD=17", "-DCMAKE_CXX_EXTENSIONS=OFF"
            }
        }
    }

    buildTypes {
         debug {
             initWith debug
             debuggable    true
             jniDebuggable true
             signingConfig signingConfigs.juceSigning
         }
         release {
             initWith release
             debuggable    false
             jniDebuggable false
             signingConfig signingConfigs.juceSigning
         }
    }

    flavorDimensions "default"
    productFlavors {
        debug_ {
            ndk {
                abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O0"
                    cppFlags  "-O0"
                    arguments "-DJUCE_BUILD_CONFIGURATION=DEBUG"
                }
            }

            dimension "default"
        }
        release_ {
            externalNativeBuild {
                cmake {
                    cFlags    "-O3"
                    cppFlags  "-O3"
                    arguments "-DJUCE_BUILD_CONFIGURATION=RELEASE"
                }
            }

            dimension "default"
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains ("debug_")
              && variant.buildType.name != "debug") {
            setIgnore(true)
        }
        if (names.contains ("release_")
              && variant.buildType.name != "release") {
            setIgnore(true)
        }
    }

    sourceSets {
        main.java.srcDirs +=
            ["../../../../Source/android/java",
             "../../../../deps/juce/modules/juce_core/native/javacore/init",
             "../../../../deps/juce/modules/juce_core/native/javacore/app",
             "../../../../deps/juce/modules/juce_gui_basics/native/javaopt/app"]

        main.res.srcDirs +=
            []
    }

    repositories {
        maven { url 'https://maven.google.com' }
    }

    dependencies {
        def core_version = "1.18.0"
        implementation "androidx.core:core:$core_version"
        implementation "androidx.core:core-ktx:$core_version"
        
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    }

ndkVersion "28.2.13676358"
lintOptions {
     abortOnError false
}
  
// ensure Java 8 is used
compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
 }

 buildFeatures {
       buildConfig = true
 }


}

